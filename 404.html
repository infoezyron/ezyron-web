<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0B0D">
<meta name="robots" content="noindex">
<title>Página no encontrada · Ezyron</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--ink:#0B0B0D;--cream:#F0E8DC;--red:#E3232D;--mute:rgba(240,232,220,.6);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;background:radial-gradient(70% 60% at 50% 45%,rgba(227,35,45,.14),transparent 70%),var(--ink);color:var(--cream);font:400 16px/1.5 'Inter Tight',system-ui,sans-serif;display:grid;place-items:center;text-align:center;padding:24px;-webkit-font-smoothing:antialiased}
.dot{width:18px;height:18px;border-radius:50%;background:var(--red);margin:0 auto 34px;box-shadow:0 0 30px rgba(227,35,45,.8);animation:p 2.4s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.25)}}
.m{font:500 11px/1.4 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1{font:800 clamp(44px,8vw,96px)/.9 'Inter Tight',sans-serif;letter-spacing:-.055em;margin:18px 0 16px}
h1 em{font:italic 400 1em 'Instrument Serif',Georgia,serif;letter-spacing:-.01em}
p{color:var(--mute);max-width:36ch;margin:0 auto}
a{display:inline-flex;align-items:center;gap:10px;margin-top:34px;padding:12px 20px 12px 16px;border:1px solid var(--cream);border-radius:99px;color:var(--cream);text-decoration:none;font-weight:500;font-size:14px;transition:background .3s,color .3s}
a i{width:7px;height:7px;border-radius:50%;background:var(--red)}
a:hover{background:var(--cream);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<main>
  <div class="dot" aria-hidden="true"></div>
  <span class="m">Error 404</span>
  <h1>Este punto <em>no existe.</em></h1>
  <p>La página que buscas se ha movido o nunca estuvo aquí. Todo vuelve a empezar en el inicio.</p>
  <a href="/"><i></i>Volver a ezyron.com</a>
</main>
</body>
</html>
